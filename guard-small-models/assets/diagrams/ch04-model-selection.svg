<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#fbfaf6"/><g font-family="Arial,'PingFang SC',sans-serif" fill="#263238"><text x="50" y="52" font-size="24" font-weight="700">模型选型不是单指标排名</text><text x="50" y="82" font-size="15" fill="#667085">在同一切分与工作点上比较质量、延迟和可运维性</text><line x1="110" y1="485" x2="820" y2="485" stroke="#344054" stroke-width="2"/><line x1="110" y1="485" x2="110" y2="135" stroke="#344054" stroke-width="2"/><text x="720" y="525" font-size="15">延迟 / 资源成本 →</text><text x="35" y="150" font-size="15" transform="rotate(-90 35 150)">安全质量 →</text><path d="M150 415C260 330 360 275 470 245S690 170 785 150" fill="none" stroke="#315b9a" stroke-width="3" stroke-dasharray="8 6"/><g font-size="14" text-anchor="middle"><circle cx="200" cy="375" r="19" fill="#315b9a"/><text x="200" y="415">规则</text><circle cx="325" cy="300" r="22" fill="#5d7fb3"/><text x="325" y="343">TF-IDF</text><circle cx="440" cy="245" r="24" fill="#315b9a"/><text x="440" y="290">CNN</text><circle cx="590" cy="220" r="27" fill="#b8891b"/><text x="590" y="270">BGE</text><circle cx="745" cy="165" r="30" fill="#975b5b"/><text x="745" y="220">Qwen</text></g><rect x="865" y="135" width="285" height="350" rx="8" fill="#fff" stroke="#98a2b3"/><text x="892" y="175" font-size="17" font-weight="700">共同评测协议</text><g font-size="14"><text x="892" y="215">1. 固定 group split</text><text x="892" y="252">2. 验证集选择阈值</text><text x="892" y="289">3. 密封测试集一次评估</text><text x="892" y="326">4. 报告 FPR / Recall / 切片</text><text x="892" y="363">5. 测量 p95 / p99 / 吞吐</text><text x="892" y="400">6. 保存配置、种子与制品</text></g><text x="892" y="450" font-size="13" fill="#667085">Pareto 前沿随业务约束变化，</text><text x="892" y="472" font-size="13" fill="#667085">不存在跨场景“最佳模型”。</text></g></svg>
