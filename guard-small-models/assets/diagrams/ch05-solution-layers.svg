<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><rect width="1200" height="590" fill="#fbfaf6"/><g font-family="Arial,'PingFang SC',sans-serif" fill="#263238"><text x="50" y="52" font-size="24" font-weight="700">护栏方案的责任边界</text><text x="50" y="82" font-size="15" fill="#667085">比较“在哪里运行、覆盖什么、由谁承担故障”</text><g font-size="16"><rect x="70" y="130" width="1060" height="70" rx="7" fill="#e8eef8" stroke="#315b9a"/><text x="95" y="172" font-weight="700">应用策略层</text><text x="290" y="172">角色、租户、审批、降级、审计</text><rect x="70" y="220" width="1060" height="70" rx="7" fill="#edf5ef" stroke="#4f7b5b"/><text x="95" y="262" font-weight="700">安全检测层</text><text x="290" y="262">输入分类、输出审核、注入检测、PII、恶意文件</text><rect x="70" y="310" width="1060" height="70" rx="7" fill="#f7edcf" stroke="#b8891b"/><text x="95" y="352" font-weight="700">模型服务层</text><text x="290" y="352">厂商内置护栏 / 云 API / 自建 SmallGuard / 级联路由</text><rect x="70" y="400" width="1060" height="70" rx="7" fill="#f4ecec" stroke="#975b5b"/><text x="95" y="442" font-weight="700">基础设施层</text><text x="290" y="442">身份、网络、密钥、沙箱、日志、供应链与容量</text></g><line x1="250" y1="500" x2="250" y2="535" stroke="#315b9a" stroke-width="2"/><line x1="600" y1="500" x2="600" y2="535" stroke="#315b9a" stroke-width="2"/><line x1="950" y1="500" x2="950" y2="535" stroke="#315b9a" stroke-width="2"/><g font-size="14" text-anchor="middle"><text x="250" y="560">内置：低集成成本</text><text x="600" y="560">托管：运营能力强</text><text x="950" y="560">自建：控制与审计强</text></g></g></svg>
