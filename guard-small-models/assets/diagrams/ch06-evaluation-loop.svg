<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b9a"/></marker></defs><rect width="1200" height="600" fill="#fbfaf6"/><g font-family="Arial,'PingFang SC',sans-serif" fill="#263238"><text x="50" y="52" font-size="24" font-weight="700">持续评测：固定回归与时间外分布</text><text x="50" y="82" font-size="15" fill="#667085">固定 Bench 发现模型回退；时间戳样本发现分布漂移</text><g font-size="16" text-anchor="middle"><rect x="70" y="200" width="190" height="105" rx="7" fill="#e8eef8" stroke="#315b9a"/><text x="165" y="240" font-weight="700">候选版本</text><text x="165" y="270" font-size="13">模型 + 阈值 + 策略</text><rect x="350" y="120" width="210" height="105" rx="7" fill="#fff" stroke="#98a2b3"/><text x="455" y="160" font-weight="700">固定回归集</text><text x="455" y="190" font-size="13">功能回退 / 可比性</text><rect x="350" y="290" width="210" height="105" rx="7" fill="#fff" stroke="#98a2b3"/><text x="455" y="330" font-weight="700">时间外 / 红队集</text><text x="455" y="360" font-size="13">漂移 / 自适应攻击</text><rect x="650" y="200" width="220" height="105" rx="7" fill="#f7edcf" stroke="#b8891b"/><text x="760" y="240" font-weight="700">分层指标</text><text x="760" y="270" font-size="13">FPR · Recall · CI · 延迟</text><rect x="960" y="200" width="170" height="105" rx="7" fill="#edf5ef" stroke="#4f7b5b"/><text x="1045" y="240" font-weight="700">发布门</text><text x="1045" y="270" font-size="13">通过 / 阻断 / 复核</text></g><g fill="none" stroke="#315b9a" stroke-width="2" marker-end="url(#a)"><path d="M260 245C310 245 305 172 345 172"/><path d="M260 260C310 260 305 342 345 342"/><path d="M560 172C610 172 610 235 645 245"/><path d="M560 342C610 342 610 270 645 260"/><path d="M870 252H955"/><path d="M1045 305C1045 475 205 500 165 310"/></g><text x="600" y="520" font-size="14" text-anchor="middle" fill="#667085">失败样本 → 人工裁决 → 数据版本 → 再训练；密封测试集不得直接回流</text></g></svg>
