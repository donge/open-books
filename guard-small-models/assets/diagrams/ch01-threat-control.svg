<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b9a"/></marker></defs>
<rect width="1200" height="620" fill="#fbfaf6"/><g font-family="Arial,'PingFang SC',sans-serif" fill="#263238">
<text x="50" y="52" font-size="24" font-weight="700">输入载体 × 风险 × 控制面</text><text x="50" y="82" font-size="15" fill="#667085">模型输出是检测信号，不是最终授权</text>
<g font-size="17" text-anchor="middle"><rect x="55" y="140" width="180" height="62" rx="6" fill="#e8eef8" stroke="#315b9a"/><text x="145" y="177">单轮 / 多轮</text><rect x="55" y="225" width="180" height="62" rx="6" fill="#e8eef8" stroke="#315b9a"/><text x="145" y="262">文档 / 多模态</text></g>
<path d="M235 171H315M235 256H315" stroke="#315b9a" stroke-width="2" marker-end="url(#a)"/>
<rect x="320" y="118" width="300" height="205" rx="8" fill="#fff" stroke="#98a2b3"/><text x="340" y="150" font-size="17" font-weight="700">风险识别</text><g font-size="15"><text x="350" y="187">指令操纵</text><text x="480" y="187">对抗扰动</text><text x="350" y="224">资源滥用</text><text x="480" y="224">工具越权</text><text x="350" y="261">内容安全</text><text x="480" y="261">隐私泄露</text></g>
<path d="M620 220H700" stroke="#315b9a" stroke-width="2" marker-end="url(#a)"/><rect x="705" y="118" width="210" height="205" rx="8" fill="#e8eef8" stroke="#315b9a"/><text x="810" y="157" font-size="17" font-weight="700" text-anchor="middle">SmallGuard</text><text x="810" y="194" font-size="15" text-anchor="middle">规则信号</text><text x="810" y="226" font-size="15" text-anchor="middle">语义分数</text><text x="810" y="258" font-size="15" text-anchor="middle">置信度 / 切片</text><text x="810" y="292" font-size="14" fill="#667085" text-anchor="middle">允许 · 灰区 · 拒绝</text>
<path d="M915 220H985" stroke="#315b9a" stroke-width="2" marker-end="url(#a)"/><rect x="990" y="102" width="165" height="78" rx="6" fill="#f7edcf" stroke="#b8891b"/><text x="1072" y="135" font-size="16" font-weight="700" text-anchor="middle">权限策略</text><text x="1072" y="160" font-size="13" text-anchor="middle">身份 · 参数 · 审批</text><rect x="990" y="197" width="165" height="78" rx="6" fill="#edf5ef" stroke="#4f7b5b"/><text x="1072" y="230" font-size="16" font-weight="700" text-anchor="middle">资源策略</text><text x="1072" y="255" font-size="13" text-anchor="middle">长度 · 超时 · 配额</text><rect x="990" y="292" width="165" height="78" rx="6" fill="#f4ecec" stroke="#975b5b"/><text x="1072" y="325" font-size="16" font-weight="700" text-anchor="middle">数据策略</text><text x="1072" y="350" font-size="13" text-anchor="middle">脱敏 · 最小化 · 审计</text>
<line x1="50" y1="410" x2="1150" y2="410" stroke="#d0d5dd"/><text x="50" y="450" font-size="16" font-weight="700">判定边界</text><text x="50" y="482" font-size="15">文本检测覆盖已知表达；不可绕过的控制必须位于工具、资源和数据层。</text><text x="50" y="515" font-size="15">未知攻击、解析缺陷与多轮语境需要独立评测集和持续回流。</text>
</g></svg>
