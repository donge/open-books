<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b9a"/></marker></defs><rect width="1200" height="600" fill="#fbfaf6"/><g font-family="Arial,'PingFang SC',sans-serif" fill="#263238"><text x="50" y="52" font-size="24" font-weight="700">可验证安全系统的证据链</text><text x="50" y="82" font-size="15" fill="#667085">从风险声明到运行证据，每一环都有版本和责任人</text><g font-size="15" text-anchor="middle"><rect x="45" y="190" width="165" height="105" rx="7" fill="#fff" stroke="#98a2b3"/><text x="127" y="228" font-weight="700">威胁模型</text><text x="127" y="255" font-size="13">资产 · 对手 · 边界</text><rect x="240" y="190" width="165" height="105" rx="7" fill="#e8eef8" stroke="#315b9a"/><text x="322" y="228" font-weight="700">控制设计</text><text x="322" y="255" font-size="13">模型 + 策略 + 权限</text><rect x="435" y="190" width="165" height="105" rx="7" fill="#e8eef8" stroke="#315b9a"/><text x="517" y="228" font-weight="700">评测协议</text><text x="517" y="255" font-size="13">切片 · 阈值 · 基准</text><rect x="630" y="190" width="165" height="105" rx="7" fill="#f7edcf" stroke="#b8891b"/><text x="712" y="228" font-weight="700">发布证据</text><text x="712" y="255" font-size="13">制品 · SHA · 签名</text><rect x="825" y="190" width="165" height="105" rx="7" fill="#edf5ef" stroke="#4f7b5b"/><text x="907" y="228" font-weight="700">运行证据</text><text x="907" y="255" font-size="13">告警 · 审计 · SLO</text><rect x="1020" y="190" width="145" height="105" rx="7" fill="#f4ecec" stroke="#975b5b"/><text x="1092" y="228" font-weight="700">复核</text><text x="1092" y="255" font-size="13">事件与再认证</text></g><g stroke="#315b9a" stroke-width="2" marker-end="url(#a)"><path d="M210 242H235"/><path d="M405 242H430"/><path d="M600 242H625"/><path d="M795 242H820"/><path d="M990 242H1015"/></g><rect x="170" y="385" width="860" height="105" rx="7" fill="#fff" stroke="#98a2b3"/><text x="205" y="420" font-size="16" font